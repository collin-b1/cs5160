<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Rendering Algo</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #050510;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 0.8em;
      }

      header {
        line-height: 1em;
        padding: 0 1em;
        border-bottom: 1px solid #666;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Project 1</h1>
      <p>by: Collin Barrett</p>
    </header>
    <main>
      <canvas id="canvas"></canvas>
    </main>
    <script>
      //we add shapes (like lines) to this canvas
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let playerSpeed = 0.1;
      const speedLimit = 0.5;

      class Mesh {
        #vertices; // Array({x,y,z})
        #edges = new Map(); // Set<string> e.g. {"0,1": [0, 1], "3,7": [3, 7]}
        #faces; // Array(3)
        constructor({ vertices = [], faces = [] } = {}) {
          //todo: prevent mutation from outside
          this.#vertices = vertices;
          this.#faces = faces;

          faces.forEach(face => {
            for (let i = 0; i < face.length; ++i) {
              const v1 = face[i];
              const v2 = face[(i + 1) % face.length];
              const edge = [v1, v2].sort((a, b) => a - b);
              this.#edges.set(edge.join(","), edge);
            }
          });

          console.log("Vertices:", this.#vertices);
          console.log("Edges:", this.#edges);
          console.log("Faces:", this.#faces);
        }

        get vertices() {
          return this.#vertices;
        }

        get faces() {
          return this.#faces;
        }

        get edges() {
          return Array.from(this.#edges.values());
        }
      }

      class WorldObject {
        #mesh;
        pos;
        constructor(mesh, pos = { x: 0, y: 0, z: 0 }) {
          this.#mesh = mesh;
          this.pos = structuredClone(pos);
        }
        get mesh() {
          return this.#mesh;
        }
      }

      function parseObject(obj) {
        const vertices = [];
        const faces = [];

        const splitLines = obj.split(/\r?\n/g).map(line => line.trim());

        for (const line of splitLines) {
          const params = line.split(/\s+/);
          const varType = params.shift();
          switch (varType) {
            case "v":
              const vertex = params.map(s => parseFloat(s));
              vertices.push({ x: vertex[0], y: vertex[1], z: vertex[2] });
              break;
            case "f":
              const face = params.map(s => parseInt(s) - 1); // subtract one for zero indexing
              faces.push(face);
              break;
            default:
              break;
          }
        }

        // console.log(vertices, faces);

        return {
          vertices,
          faces,
        };
      }

      const pineObj = `
        o Pine
        v 0.000000 6.000000 0.000000
        v 0.500000 3.000000 -1.250000
        v 1.250000 3.000000 -0.500000
        v 1.250000 3.000000 0.500000
        v 0.500000 3.000000 1.250000
        v -1.250000 3.000000 -0.500000
        v -0.500000 3.000000 -1.250000
        v -0.500000 3.000000 1.250000
        v -1.250000 3.000000 0.500000
        v 0.250000 3.000000 -0.100000
        v 0.100000 3.000000 -0.250000
        v 0.100000 0.000000 -0.250000
        v 0.250000 0.000000 -0.100000
        v 0.100000 3.000000 0.250000
        v 0.250000 3.000000 0.100000
        v 0.250000 0.000000 0.100000
        v 0.100000 0.000000 0.250000
        v -0.100000 3.000000 -0.250000
        v -0.250000 3.000000 -0.100000
        v -0.250000 0.000000 -0.100000
        v -0.100000 0.000000 -0.250000
        v -0.250000 3.000000 0.100000
        v -0.100000 3.000000 0.250000
        v -0.100000 0.000000 0.250000
        v -0.250000 0.000000 0.100000
        s 0
        f 1 3 2
        f 8 1 9
        f 1 5 4
        f 1 7 6
        f 7 1 2
        f 3 1 4
        f 5 1 8
        f 9 1 6
        f 3 7 2
        f 3 4 7
        f 4 9 6
        f 5 9 4
        f 5 8 9
        f 4 6 7
        f 10 13 12 11
        f 24 23 22 25
        f 14 17 16 15
        f 18 21 20 19
        f 21 18 11 12
        f 13 10 15 16
        f 17 14 23 24
        f 25 22 19 20
      `;
      const pineMesh = new Mesh(parseObject(pineObj));

      const skiObject = `
        o Ski
        v 0.250000 0.050000 2.471404
        v 0.250000 0.050000 -4.482312
        v -0.250000 0.050000 2.471404
        v -0.250000 0.050000 -4.482312
        v 0.250000 0.050000 2.471404
        v -0.250000 0.050000 2.471404
        v 0.112778 0.252497 2.971404
        v -0.112778 0.252497 2.971404
        s 0
        f 1 2 4 3
        f 5 7 8 6
      `;
      const skiMesh = new Mesh(parseObject(skiObject));

      const numPines = 50;
      const pines = [];
      for (let i = 0; i < numPines; ++i) {
        const pine = new WorldObject(pineMesh, {
          x: (Math.random() - 0.5) * 100,
          y: -1.5,
          z: Math.random() * 1000 + 5,
        });
        pines.push(pine);
      }
      console.log(pines);

      const skiLeft = new WorldObject(skiMesh);
      const skiRight = new WorldObject(skiMesh);

      const worldObjects = new Set();
      pines.forEach(pine => worldObjects.add(pine));
      worldObjects.add(skiLeft);
      worldObjects.add(skiRight);

      console.log(worldObjects);

      const camera = { x: 0, y: 0, z: 0 };

      window.requestAnimationFrame(gameLoop);

      const nearCutoff = 0.1;
      const project = c => ({
        u: (c.x / c.z) * canvas.width + canvas.width / 2,
        v: (c.y / c.z) * canvas.height + canvas.height / 2,
      });
      const clip = (behind, front) => {
        const t = (nearCutoff - front.z) / (behind.z - front.z);
        return {
          x: front.x + t * (behind.x - front.x),
          y: front.y + t * (behind.y - front.y),
          z: nearCutoff,
        };
      };

      function draw() {
        //here we set up and clear the canvas, every draw frame
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#050510";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const worldObj of worldObjects) {
          const { vertices, edges } = worldObj.mesh;

          const camVerts = [];

          for (let v = 0; v < vertices.length; v++) {
            let camVert = {};

            // Need to subtract camera position from vertex pos
            camVert.x = vertices[v].x + worldObj.pos.x - camera.x;
            camVert.y = vertices[v].y + worldObj.pos.y - camera.y;
            camVert.z = vertices[v].z + worldObj.pos.z - camera.z;

            camVerts.push(camVert);
          }

          for (let e = 0; e < edges.length; e++) {
            let c1 = camVerts[edges[e][0]];
            let c2 = camVerts[edges[e][1]];

            // Don't render the projected line if its behind the camera
            if (c1.z < nearCutoff && c2.z < nearCutoff) continue;
            if (c1.z < nearCutoff) {
              c1 = clip(c1, c2);
            } else if (c2.z < nearCutoff) {
              c2 = clip(c2, c1);
            }

            const p1 = project(c1);
            const p2 = project(c2);

            const u1 = p1.u;
            const v1 = canvas.height - p1.v;

            const u2 = p2.u;
            const v2 = canvas.height - p2.v;

            drawLine(u1, v1, u2, v2);
          }
        }
      }

      //This uses a built in 'drawLine' function, provided by the javascript canvas
      function drawLine(x1, y1, x2, y2) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "white";

        //this is how you draw a line on the canvas
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      //this is how we detect events-

      const MOVE_AMOUNT = 0.25;
      document.addEventListener("keydown", event => {
        event.preventDefault();
        switch (event.code) {
          case "ArrowUp":
            camera.z += MOVE_AMOUNT;
            console.log("Up arrow pressed");
            break;
          case "ArrowDown":
            camera.z -= MOVE_AMOUNT;
            console.log("Down arrow pressed");
            break;
          case "ArrowLeft":
            camera.x -= MOVE_AMOUNT;
            console.log("Left arrow pressed");
            break;
          case "ArrowRight":
            camera.x += MOVE_AMOUNT;
            console.log("Right arrow pressed");
            break;
          case "KeyR":
            // Reset camera to original position from earlier
            camera.x = 0;
            camera.y = 0;
            camera.z = -10;
            console.log("Reset");
            playerSpeed = 0.1;
            break;
          default:
            return;
        }
      });

      let deltaTime = 0.0;
      let prevTime, fps;
      function gameLoop(timestamp) {
        deltaTime = (timestamp - prevTime) / 1000;
        prevTime = timestamp;
        const fps = Math.round(1 / deltaTime);

        camera.z += Math.min(playerSpeed, speedLimit);
        // camera.y -= 0.005;

        skiLeft.pos = { x: camera.x - 0.5, y: camera.y - 1.5, z: camera.z + 2 };
        skiRight.pos = {
          x: camera.x + 0.5,
          y: camera.y - 1.5,
          z: camera.z + 2,
        };

        draw();

        if (playerSpeed <= speedLimit) {
          playerSpeed *= 1.01;
        }

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText(`${fps} fps`, 8, 24);

        requestAnimationFrame(gameLoop);
      }

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
    </script>
  </body>
</html>
