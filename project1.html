<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Rendering Algo</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #050510;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 0.8em;
      }

      header {
        line-height: 1em;
        padding: 0 1em;
        border-bottom: 1px solid #666;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Project 1</h1>
      <p>by: Collin Barrett</p>
    </header>
    <main>
      <canvas id="canvas"></canvas>
    </main>
    <script>
      //we add shapes (like lines) to this canvas
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      class Mesh {
        #vertices; // Array({x,y,z})
        #edges = new Map(); // Set<string> e.g. {"0,1": [0, 1], "3,7": [3, 7]}
        #faces; // Array(3)
        constructor({ vertices = [], faces = [] } = {}) {
          //todo: prevent mutation from outside
          this.#vertices = vertices;
          this.#faces = faces;

          faces.forEach(face => {
            for (let i = 0; i < face.length; ++i) {
              const v1 = face[i];
              const v2 = face[(i + 1) % face.length];
              const edge = [v1, v2].sort((a, b) => a - b);
              this.#edges.set(edge.join(","), edge);
            }
          });

          console.log("Vertices:", this.#vertices);
          console.log("Edges:", this.#edges);
          console.log("Faces:", this.#faces);
        }

        get vertices() {
          return this.#vertices;
        }

        get faces() {
          return this.#faces;
        }

        get edges() {
          return Array.from(this.#edges.values());
        }
      }

      class WorldObject {
        #mesh;
        pos;
        constructor(mesh, pos = { x: 0, y: 0, z: 0 }) {
          this.#mesh = mesh;
          this.pos = structuredClone(pos);
        }
        get mesh() {
          return this.#mesh;
        }
      }

      function parseObject(obj) {
        const vertices = [];
        const faces = [];

        const splitLines = obj.split(/\r?\n/g).map(line => line.trim());

        for (const line of splitLines) {
          const params = line.split(/\s+/);
          const varType = params.shift();
          switch (varType) {
            case "v":
              const vertex = params.map(s => parseFloat(s));
              vertices.push({ x: vertex[0], y: vertex[1], z: vertex[2] });
              break;
            case "f":
              const face = params.map(s => parseInt(s) - 1); // subtract one for zero indexing
              faces.push(face);
              break;
            default:
              break;
          }
        }

        // console.log(vertices, faces);

        return {
          vertices,
          faces,
        };
      }

      const cubeObj = `
        o Cube
        v 1.000000 1.000000 -1.000000
        v 1.000000 -1.000000 -1.000000
        v 1.000000 1.000000 1.000000
        v 1.000000 -1.000000 1.000000
        v -1.000000 1.000000 -1.000000
        v -1.000000 -1.000000 -1.000000
        v -1.000000 1.000000 1.000000
        v -1.000000 -1.000000 1.000000
        s 0
        f 1 5 7 3
        f 4 3 7 8
        f 8 7 5 6
        f 6 2 4 8
        f 2 1 3 4
        f 6 5 1 2
      `;
      const cubeMesh = new Mesh(parseObject(cubeObj));

      const pyramidObj = `
        o Pyramid
        v -0.037956 1.199100 -0.016197
        v 1.000000 -1.000000 -1.000000
        v 1.000000 -1.000000 1.000000
        v -1.000000 -1.000000 -1.000000
        v -1.000000 -1.000000 1.000000
        s 0
        f 3 1 5
        f 5 1 4
        f 4 2 3 5
        f 2 1 3
        f 4 1 2
      `;
      const pyramidMesh = new Mesh(parseObject(pyramidObj));

      // Create some objects
      const cube = new WorldObject(cubeMesh, {
        x: 2,
        y: 0,
        z: 0,
      });
      const pyramid = new WorldObject(pyramidMesh, {
        x: -2,
        y: 0,
        z: 0,
      });

      const worldObjects = new Set();
      worldObjects.add(cube);
      worldObjects.add(pyramid);

      console.log(worldObjects);

      const camera = { x: 0, y: 0, z: -10 };

      window.requestAnimationFrame(gameLoop);

      function draw() {
        //here we set up and clear the canvas, every draw frame
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#050510";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const worldObj of worldObjects) {
          const { vertices, edges } = worldObj.mesh;

          // here we will store u,v coordinates for the vertices,
          // projected onto our 2d plane
          const projectedVertices = [];

          //- loop through the original vertices (X, Y, Z)
          //- and determine their position in 3D space relative to camera (x, y, z)
          //- then project them onto the 2D plane
          for (let v = 0; v < vertices.length; v++) {
            //  you could also write it foreach...
            // console.log("original position:"); //helpful to print things
            // console.log(vertices[v]);

            // console.log("camera-relative position");
            let camVert = {};

            // Need to subtract camera position from vertex pos
            camVert.x = vertices[v].x + worldObj.pos.x - camera.x;
            camVert.y = vertices[v].y + worldObj.pos.y - camera.y;
            camVert.z = vertices[v].z + worldObj.pos.z - camera.z;
            // console.log(camVert);

            if (camVert.z < 0) {
              projectedVertices.push(null);
              continue;
            }

            // console.log("projected position");
            let canvasPos = {};

            // Horizontal calculation based on u/1 = x/z
            canvasPos.u = camVert.x / camVert.z;

            // Vertical calculation based on v/1 = y/z
            canvasPos.v = camVert.y / camVert.z;
            // console.log(canvasPos);

            // console.log("scale and center");
            canvasPos.u = canvasPos.u * canvas.width + canvas.width / 2;
            canvasPos.v = canvasPos.v * canvas.height + canvas.height / 2;
            // console.log(canvasPos);

            projectedVertices.push(canvasPos);
            // console.log("---------------");
          }

          //loop through the edges
          //  find the newly computed projected vertices - 2 per edge
          //  draw the line
          for (let e = 0; e < edges.length; e++) {
            // v needs to be flipped because javascript canvas
            // uses y=0 at the top of the screen and going down on the
            // screen increases y.

            //first vertex
            const p1 = projectedVertices[edges[e][0]];
            const p2 = projectedVertices[edges[e][1]];

            // Don't render the projected line if its behind the camera
            if (!p1 || !p2) continue;

            const u1 = p1.u;
            const v1 = canvas.height - p1.v;

            const u2 = p2.u;
            const v2 = canvas.height - p2.v;

            drawLine(u1, v1, u2, v2);
          }
        }
      }

      //This uses a built in 'drawLine' function, provided by the javascript canvas
      function drawLine(x1, y1, x2, y2) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "white";

        //this is how you draw a line on the canvas
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      //this is how we detect events-

      const MOVE_AMOUNT = 0.25;
      document.addEventListener("keydown", event => {
        event.preventDefault();
        switch (event.code) {
          case "ArrowUp":
            camera.z += MOVE_AMOUNT;
            console.log("Up arrow pressed");
            break;
          case "ArrowDown":
            camera.z -= MOVE_AMOUNT;
            console.log("Down arrow pressed");
            break;
          case "ArrowLeft":
            camera.x -= MOVE_AMOUNT;
            console.log("Left arrow pressed");
            break;
          case "ArrowRight":
            camera.x += MOVE_AMOUNT;
            console.log("Right arrow pressed");
            draw();
            break;
          case "KeyR":
            // Reset camera to original position from earlier
            camera.x = 0;
            camera.y = 0;
            camera.z = -10;
            console.log("Reset");
            draw();
            break;
          default:
            return;
        }
      });

      let deltaTime = 0.0;
      let prevTime, fps;
      function gameLoop(timestamp) {
        deltaTime = (timestamp - prevTime) / 1000;
        prevTime = timestamp;
        const fps = Math.round(1 / deltaTime);

        draw();

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText(`${fps} fps`, 8, 24);

        requestAnimationFrame(gameLoop);
      }

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
    </script>
  </body>
</html>
